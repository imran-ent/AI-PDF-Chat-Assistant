<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="title">
<title id="title">AI PDF Chat</title>
<defs>
  <!-- Main app gradient: violet-600 -> indigo-700 -->
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#4338ca"/>
  </linearGradient>
  <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#8b5cf6"/>
    <stop offset="100%" stop-color="#4f46e5"/>
  </linearGradient>
  <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ede9fe"/>
    <stop offset="100%" stop-color="#ddd6fe"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#4c1d95" flood-opacity="0.25"/>
  </filter>
</defs>

<!-- Rounded app background -->
<rect width="32" height="32" rx="8" fill="url(#bg)"/>

<!-- Subtle top gloss highlight -->
<ellipse cx="16" cy="6" rx="14" ry="5.5" fill="white" opacity="0.10"/>

<!-- Document card -->
<g filter="url(#shadow)">
  <!-- Main sheet -->
  <path d="M9 5.5H18.9L24.2 10.8V27C24.2 27.66 23.66 28.2 23 28.2H9C8.34 28.2 7.8 27.66 7.8 27V6.7C7.8 6.04 8.34 5.5 9 5.5Z" fill="white"/>
  <!-- Folded corner -->
  <path d="M18.9 5.5V9.6C18.9 10.26 19.44 10.8 20.1 10.8H24.2L18.9 5.5Z" fill="url(#fold)" stroke="#c4b5fd" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Thin border -->
  <path d="M9 5.5H18.9L24.2 10.8V27C24.2 27.66 23.66 28.2 23 28.2H9C8.34 28.2 7.8 27.66 7.8 27V6.7C7.8 6.04 8.34 5.5 9 5.5Z" fill="none" stroke="#ede9fe" stroke-width="0.45"/>
</g>

<!-- Text lines inside doc -->
<g opacity="0.95">
  <rect x="10.2" y="13.4" width="8.6" height="1.35" rx="0.67" fill="#e2e8f0"/>
  <rect x="10.2" y="15.7" width="7.2" height="1.35" rx="0.67" fill="#e2e8f0"/>
  <rect x="10.2" y="18" width="8" height="1.35" rx="0.67" fill="#f1f5f9"/>
</g>

<!-- PDF badge -->
<g>
  <rect x="9.6" y="20.55" width="9.2" height="4.4" rx="1.2" fill="#ef4444"/>
  <rect x="9.6" y="20.55" width="9.2" height="4.4" rx="1.2" fill="none" stroke="#dc2626" stroke-width="0.3" opacity="0.9"/>
  <text x="14.2" y="23.65" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="3.15" font-weight="900" letter-spacing="0.35" fill="white">PDF</text>
</g>

<!-- Chat/AI badge: white circle with sparkle -->
<g>
  <!-- outer white pill -->
  <circle cx="22.6" cy="22.1" r="6.55" fill="white" stroke="#ede9fe" stroke-width="0.7"/>
  <!-- inner subtle ring -->
  <circle cx="22.6" cy="22.1" r="6.55" fill="none" stroke="#ddd6fe" stroke-width="0.25" opacity="0.6"/>
  <!-- sparkle star - 4-point -->
  <g transform="translate(22.6 22.1)">
    <path d="M0 -4.05 L1.05 -1.05 L4.05 0 L1.05 1.05 L0 4.05 L-1.05 1.05 L-4.05 0 L-1.05 -1.05 Z" fill="url(#sparkle)" stroke="white" stroke-width="0.28" stroke-linejoin="round"/>
    <!-- micro sparkles -->
    <circle cx="2.9" cy="-2.45" r="0.85" fill="#a78bfa"/>
    <circle cx="-2.7" cy="2.55" r="0.65" fill="#8b5cf6" opacity="0.95"/>
    <circle cx="1.9" cy="2.95" r="0.42" fill="#c4b5fd" opacity="0.9"/>
  </g>
</g>

<!-- Small chat dots hint inside document top? Optional: keep clean -->

</svg>
