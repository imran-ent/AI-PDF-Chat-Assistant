services:
  - type: web
    name: ai-pdf-chat-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://ai-pdf-chat-assistant-ashen.vercel.app
      - key: PYTHON_VERSION
        value: 3.11.0
